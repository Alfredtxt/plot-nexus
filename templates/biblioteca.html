<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Archives - PlotNexus</title>
    <style>
        body { 
            font-family: 'Georgia', serif; 
            background-color: #1a1a1a; 
            background-image: linear-gradient(rgba(26, 26, 26, 0.9), rgba(26, 26, 26, 0.9)), url('/static/library_bg.jpg'); 
            background-size: cover; 
            background-attachment: fixed; 
            color: #e8dcc4; 
            margin: 0; 
            padding: 0; 
        }
        nav { background-color: rgba(13, 13, 13, 0.9); padding: 15px 30px; border-bottom: 2px solid #d4af37; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.8em; font-weight: bold; color: #d4af37; text-decoration: none; letter-spacing: 2px; }
        .nav-links { list-style: none; margin: 0; padding: 0; display: flex; }
        .nav-links li { position: relative; margin-left: 20px; }
        .nav-links a { color: #e8dcc4; text-decoration: none; font-size: 1.1em; padding: 10px; transition: color 0.3s; }
        .nav-links a:hover { color: #d4af37; }
        .dropdown-content { display: none; position: absolute; background-color: #0d0d0d; min-width: 200px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5); z-index: 1; top: 100%; left: 0; border: 1px solid #d4af37; border-top: none; }
        .dropdown-content a { color: #e8dcc4; padding: 12px 16px; text-decoration: none; display: block; }
        .dropdown-content a:hover { background-color: #1a1a1a; color: #d4af37; }
        .dropdown:hover .dropdown-content { display: block; }

        .library-header { text-align: center; padding: 60px 20px; color: #d4af37; }
        .library-header h1 { font-size: 3.5em; margin: 0; text-shadow: 2px 2px 4px #000; }
        
        .sections-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 30px; 
            padding: 40px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        
        .section-card {
            background: rgba(13, 13, 13, 0.85); 
            padding: 30px; 
            border-radius: 8px; 
            text-align: center;
            border: 2px solid #5a1818;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            color: #e8dcc4;
        }
        .section-card:hover { 
            transform: translateY(-5px); 
            border-color: #d4af37; 
            background: rgba(26, 26, 26, 0.95); 
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2); 
        }
        .section-title { font-size: 1.8em; font-weight: bold; color: #d4af37; margin-bottom: 10px; }
        .section-desc { font-style: italic; color: #b0a080; }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo">📚✨ PlotNexus</a>
        <ul class="nav-links">
            <li><a href="/">Entrance Hall</a></li>
            <li class="dropdown">
                <a href="#">Library ▾</a>
                <div class="dropdown-content">
                    <a href="/biblioteca">The Archives (Catalog)</a>
                </div>
            </li>
            <li><a href="/nexus" style="color: #d4af37;">Speak with Nexus</a></li>
        </ul>
    </nav>

    <div class="library-header">
        <h1>The Archives</h1>
        <p style="color: #b0a080; font-size: 1.2em; font-style: italic;">Choose an emotional resonance to explore</p>
    </div>

    <!-- Qui è dove Flask inietta le 10 sezioni! -->
    <div class="sections-grid">
        {% for emotion in emotions %}
        <a href="/biblioteca/{{ emotion.name }}" class="section-card">
            <div class="section-title">{{ emotion.name }}</div>
            <div class="section-desc">{{ emotion.desc }}</div>
        </a>
        {% endfor %}
    </div>
</body>
</html>
